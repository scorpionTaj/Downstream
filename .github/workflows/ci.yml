name: CI

# All building and testing happens here: offline checks on every push and pull request,
# the live download suite on main and weekly, and the signed universal app as an artifact.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC: full suite including live downloads
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Offline checks (strict build)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version

      # The tools' --version probes and the MetadataFetcher check run against the real
      # binaries, so install them even though the offline suite needs no network.
      - name: Install yt-dlp, ffmpeg and aria2
        run: brew install yt-dlp ffmpeg aria2

      # The French/Arabic strings are generated by the script; a forgotten regeneration must not ship.
      - name: Translations are up to date
        run: |
          python3 scripts/translations.py Support
          git diff --exit-code Support/fr.lproj Support/ar.lproj

      # The build is warning-free; this step keeps it that way.
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Checks
        run: swift run DownstreamChecks

  live:
    name: Live checks (real downloads)
    if: github.event_name != 'pull_request' # pull requests run the offline suite only
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install yt-dlp, ffmpeg and aria2
        run: brew install yt-dlp ffmpeg aria2

      # The live suites that don't need YouTube run here: the real self-update from GitHub
      # Releases plus the whole offline suite. YouTube bot-walls datacenter IPs ("Sign in to
      # confirm you're not a bot"), so its suites are skipped — pass cookies as a secret, or
      # run the full --live from a residential IP, to include them. The token lifts the
      # GitHub API limit (runners share IPs and exhaust the unauthenticated 60/hour).
      - name: Live checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: swift run DownstreamChecks --live --no-youtube || swift run DownstreamChecks --live --no-youtube

  build:
    name: Universal release build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build the app (Apple Silicon and Intel)
        run: UNIVERSAL=1 scripts/bundle.sh release

      - name: Upload the app
        uses: actions/upload-artifact@v5
        with:
          name: Downstream-app
          path: build/Downstream.app

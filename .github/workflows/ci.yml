name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Checks and app build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      # The French/Arabic strings are generated by the script; a forgotten regeneration must not ship.
      - name: Translations are up to date
        run: |
          python3 scripts/translations.py Support
          git diff --exit-code Support/fr.lproj Support/ar.lproj

      # Offline checks only: the live ones need yt-dlp, ffmpeg and the network.
      - name: Checks
        run: swift run DownstreamChecks

      - name: Build the app (Apple Silicon and Intel)
        run: UNIVERSAL=1 scripts/bundle.sh release
